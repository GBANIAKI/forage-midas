# Test-specific application properties
# Test Profile Configuration
spring.profiles.active=test

# Application Context
spring.application.name=midas-core-test

# Logging Configuration
logging.level.root=INFO
logging.level.com.jpmc.midascore=DEBUG
logging.level.org.springframework=DEBUG
logging.level.org.springframework.kafka=DEBUG
logging.level.org.springframework.boot.autoconfigure=DEBUG
logging.level.org.apache.kafka=DEBUG

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Kafka Test Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=test-group
spring.kafka.consumer.auto-offset-reset=earliest

# Disable Specific Auto-Configurations
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Bean Definition
spring.main.allow-bean-definition-overriding=true

# Test-Specific Flags
app.test.mode=true
app.feature.flag=false

# Embedded Kafka Properties
spring.embedded.kafka.brokers=localhost:9092

# Actuator Endpoints
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Cache Configuration
spring.cache.type=simple

# Validation
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
spring.jpa.hibernate.cache.use_second_level_cache=true
spring.jpa.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory

# Disable specific auto-configurations if needed
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration


spring.jpa.properties.hibernate.cache.use_query_cache=true


# Detailed condition evaluation
debug=true